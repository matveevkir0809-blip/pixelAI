<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; }
        .header { padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-size: 24px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .logo img { width: 45px; height: 45px; border-radius: 10px; }
        .btn { padding: 12px 24px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #ec4899); color: white; }
        .btn-outline { background: transparent; border: 2px solid #6366f1; color: #6366f1; }
        .hero { text-align: center; padding: 100px 20px; }
        .hero h1 { font-size: 48px; margin-bottom: 20px; background: linear-gradient(135deg, #6366f1, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: 18px; color: #94a3b8; margin-bottom: 40px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: #1e293b; padding: 40px; border-radius: 20px; max-width: 450px; width: 90%; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .modal-close { background: none; border: none; color: #94a3b8; font-size: 28px; cursor: pointer; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #94a3b8; }
        .form-group input { width: 100%; padding: 14px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: white; }
        .submit-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #6366f1, #ec4899); border: none; border-radius: 10px; color: white; font-weight: 600; cursor: pointer; }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg { color: #ef4444; font-size: 14px; margin-top: 10px; text-align: center; display: none; }
        .success-msg { color: #10b981; font-size: 14px; margin-top: 10px; text-align: center; display: none; }
        .try-section { margin-top: 40px; padding-top: 40px; border-top: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo"><img src="logo.png" alt="Pixel AI"><span>Pixel AI</span></div>
        <div>
            <button class="btn btn-outline" onclick="openModal('login')">Войти</button>
            <button class="btn btn-primary" onclick="openModal('register')">Начать бесплатно</button>
        </div>
    </header>

    <section class="hero">
        <h1>Создавай дизайны с ИИ</h1>
        <p>Генерируй веб-дизайн, карточки товаров и баннеры за секунды!</p>
        <button class="btn btn-primary" style="padding: 16px 32px; font-size: 18px;" onclick="openModal('register')">🚀 Начать бесплатно</button>
        
        <div class="try-section">
            <p style="color: #94a3b8; margin-bottom: 20px; font-size: 14px;">🤔 Хотите попробовать без регистрации?</p>
            <button class="btn btn-outline" style="padding: 14px 32px; font-size: 16px;" onclick="tryNow()">🎨 Попробовать прямо сейчас</button>
        </div>
    </section>

    <div class="modal" id="loginModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Вход</h3>
                <button class="modal-close" onclick="closeModal('login')">&times;</button>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group"><label>Email</label><input type="email" id="loginEmail" required placeholder="name@example.com"></div>
                <div class="form-group"><label>Пароль</label><input type="password" id="loginPassword" required placeholder="••••••••"></div>
                <button type="submit" class="submit-btn" id="loginBtn">Войти</button>
                <div id="loginError" class="error-msg"></div>
            </form>
            <p style="text-align: center; margin-top: 20px; color: #94a3b8; font-size: 14px;">Нет аккаунта? <a href="#" onclick="switchModal('login', 'register')" style="color: #6366f1;">Зарегистрироваться</a></p>
        </div>
    </div>

    <div class="modal" id="registerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Регистрация</h3>
                <button class="modal-close" onclick="closeModal('register')">&times;</button>
            </div>
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group"><label>Имя</label><input type="text" id="regName" required placeholder="Иван Иванов"></div>
                <div class="form-group"><label>Email</label><input type="email" id="regEmail" required placeholder="name@example.com"></div>
                <div class="form-group"><label>Пароль</label><input type="password" id="regPassword" required placeholder="Минимум 6 символов" minlength="6"></div>
                <button type="submit" class="submit-btn" id="regBtn">Создать аккаунт</button>
                <div id="regError" class="error-msg"></div>
                <div id="regSuccess" class="success-msg"></div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let token = localStorage.getItem('token');
        if (token) window.location.href = '/dashboard';

        function openModal(type) { document.getElementById(type + 'Modal').classList.add('active'); }
        function closeModal(type) { document.getElementById(type + 'Modal').classList.remove('active'); }
        function switchModal(from, to) { closeModal(from); setTimeout(() => openModal(to), 300); }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');
            btn.disabled = true; btn.textContent = '⏳...'; errorDiv.style.display = 'none';
            const formData = new FormData();
            formData.append('email', document.getElementById('loginEmail').value);
            formData.append('password', document.getElementById('loginPassword').value);
            try {
                const res = await fetch(`${API_URL}/api/login`, { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    window.location.href = '/dashboard';
                } else {
                    errorDiv.textContent = '❌ ' + (data.detail || 'Ошибка');
                    errorDiv.style.display = 'block';
                    btn.disabled = false; btn.textContent = 'Войти';
                }
            } catch (err) {
                errorDiv.textContent = '❌ Ошибка соединения';
                errorDiv.style.display = 'block';
                btn.disabled = false; btn.textContent = 'Войти';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            const errorDiv = document.getElementById('regError');
            const successDiv = document.getElementById('regSuccess');
            btn.disabled = true; btn.textContent = '⏳...'; errorDiv.style.display = 'none'; successDiv.style.display = 'none';
            const formData = new FormData();
            formData.append('email', document.getElementById('regEmail').value);
            formData.append('password', document.getElementById('regPassword').value);
            formData.append('name', document.getElementById('regName').value);
            try {
                const res = await fetch(`${API_URL}/api/register`, { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    successDiv.textContent = '✅ Создан!';
                    successDiv.style.display = 'block';
                    setTimeout(() => { window.location.href = '/dashboard'; }, 1000);
                } else {
                    errorDiv.textContent = '❌ ' + (data.detail || 'Ошибка');
                    errorDiv.style.display = 'block';
                    btn.disabled = false; btn.textContent = 'Создать';
                }
            } catch (err) {
                errorDiv.textContent = '❌ Ошибка соединения';
                errorDiv.style.display = 'block';
                btn.disabled = false; btn.textContent = 'Создать';
            }
        }

        function tryNow() {
            localStorage.setItem('guestGenerations', '1');
            localStorage.setItem('guestEdits', '1');
            localStorage.setItem('guestDesigns', '[]');
            localStorage.setItem('guestMode', 'true');
            window.location.href = '/dashboard';
        }

        window.onclick = function(event) { if (event.target.classList.contains('modal')) event.target.classList.remove('active'); }
    </script>
</body>
</html>
